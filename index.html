<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>은미 · 강사 프로필</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;600&family=Noto+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#C8E6F5;
    --sky-soft:#E4F3FB;
    --sky-deep:#8DCAE8;
    --peach:#F7C5A8;
    --peach-soft:#FDE8DA;
    --peach-deep:#F0A07A;
    --ink:#2C2C2C;
    --muted:#7A7A7A;
    --white:#FFFFFF;
    --serif:'Noto Serif KR', serif;
    --sans:'Noto Sans KR', sans-serif;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    font-family:var(--sans);
    color:var(--ink);
    background:var(--white);
    line-height:1.75;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  .wrap{ max-width:1020px; margin:0 auto; padding:0 32px; }

  /* ============================================
     CURTAIN HERO (구 랜딩페이지 → 스크롤 동기화 버전)
     ============================================ */

  .curtain-stage{
    position:relative;
    height:340vh; /* 이 구간 동안 스크롤 = 영상 재생 진행 */
  }

  .curtain-sticky{
    position:sticky;
    top:0;
    height:100svh;
    overflow:hidden;
    cursor:pointer;
    user-select:none;
  }

  .curtain-bg{
    position:absolute; inset:0;
    background: url('curtain.png') center center / cover no-repeat;
    z-index:1;
  }

  .curtain-video{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    z-index:2;
  }

  .curtain-light{
    position:absolute; inset:0;
    background: radial-gradient(ellipse 60% 80% at 28% 40%,
      rgba(255,245,230,.18) 0%,
      transparent 70%);
    z-index:4;
    animation: lightSway 6s ease-in-out infinite alternate;
  }
  @keyframes lightSway{
    from{ opacity:.6; transform:translateX(-8px); }
    to{ opacity:1; transform:translateX(8px); }
  }

  .veil{
    position:absolute; inset:0;
    background: linear-gradient(
      160deg,
      rgba(10,22,16,.38) 0%,
      rgba(10,22,16,.52) 60%,
      rgba(10,22,16,.72) 100%
    );
    z-index:5;
    transition: opacity .4s ease;
  }

  .curtain-center{
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    z-index:6;
    text-align:center;
    padding:24px;
    transition: opacity .5s ease;
  }

  .curtain-label{
    font-size:.78rem; letter-spacing:.22em;
    color:rgba(255,255,255,.55);
    margin-bottom:28px;
    opacity:0;
    animation: fadeUp .9s ease forwards .4s;
  }

  .curtain-hook{
    color:#fff;
    font-family:var(--serif);
    font-weight:300;
    font-size: clamp(1.7rem, 5.5vw, 3.2rem);
    line-height:1.55;
    letter-spacing:-.01em;
    opacity:0;
    animation: fadeUp 1.1s ease forwards .7s;
  }

  .curtain-hook em{
    font-style:normal;
    color:#F2A07B;
    font-weight:400;
  }

  .curtain-hint{
    margin-top:52px;
    font-size:.78rem; letter-spacing:.15em;
    color:rgba(255,255,255,.38);
    opacity:0;
    animation: fadeUp .9s ease forwards 1.5s, blink 2.8s ease-in-out infinite 2s;
  }

  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(18px); }
    to{ opacity:1; transform:translateY(0); }
  }
  @keyframes blink{
    0%,100%{ opacity:.38; }
    50%{ opacity:.7; }
  }

  /* 스크롤 진행 안내 (클릭 힌트 대신) */
  .scroll-cue{
    position:absolute;
    bottom:32px; left:50%;
    transform:translateX(-50%);
    z-index:6;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    opacity:0;
    animation: fadeUp .9s ease forwards 1.7s;
  }
  .scroll-cue__label{
    font-size:.72rem; letter-spacing:.18em;
    color:rgba(255,255,255,.5);
  }
  .scroll-cue__line{
    width:1px; height:34px;
    background:linear-gradient(to bottom, rgba(255,255,255,.55), transparent);
    animation: scrollLine 1.8s ease-in-out infinite;
  }
  @keyframes scrollLine{
    0%{ transform:scaleY(0); transform-origin:top; opacity:0; }
    40%{ transform:scaleY(1); transform-origin:top; opacity:1; }
    100%{ transform:scaleY(1); transform-origin:bottom; opacity:0; }
  }

  @media (prefers-reduced-motion:reduce){
    .curtain-light{ animation:none; }
    .curtain-hint{ animation: fadeUp .9s ease forwards 1.5s; }
    .scroll-cue__line{ animation:none; }
  }

  /* ===== HERO (구 index 히어로 — 커튼 직후 첫 콘텐츠) ===== */
  .hero{
    min-height:100svh;
    display:grid;
    grid-template-columns:1fr 1fr;
    align-items:center;
    gap:0;
    padding:80px 0;
    position:relative;
    overflow:hidden;
    background:var(--white);
  }

  .hero::before{
    content:"";
    position:absolute;
    width:420px; height:420px;
    border-radius:50%;
    background:var(--sky-soft);
    top:-60px; right:40px;
    z-index:0;
  }
  .hero::after{
    content:"";
    position:absolute;
    width:200px; height:200px;
    border-radius:50%;
    background:var(--peach-soft);
    bottom:80px; left:40px;
    z-index:0;
  }

  .hero__text{
    position:relative; z-index:1;
    padding:0 24px 0 0;
  }

  .hero__label{
    font-size:.78rem;
    letter-spacing:.18em;
    color:var(--sky-deep);
    font-weight:500;
    margin-bottom:24px;
  }

  .hero__hook{
    font-family:var(--serif);
    font-weight:400;
    font-size:clamp(1.9rem, 4.2vw, 3rem);
    line-height:1.5;
    color:var(--ink);
    margin-bottom:28px;
  }

  .hero__hook em{
    font-style:normal;
    background:linear-gradient(transparent 65%, var(--peach) 65%);
  }

  .hero__sub{
    font-size:1rem;
    color:var(--muted);
    line-height:1.85;
    max-width:38ch;
  }

  .hero__img{
    position:relative; z-index:1;
    display:flex; justify-content:center; align-items:center;
  }

  .hero__img-frame{
    width:100%;
    max-width:340px;
    aspect-ratio:1/1;
    border-radius:50%;
    overflow:hidden;
    background:var(--sky-soft);
    display:flex; align-items:center; justify-content:center;
    font-size:.88rem;
    color:var(--sky-deep);
    letter-spacing:.05em;
  }

  .hero__img-frame img{
    width:100%; height:100%; object-fit:cover;
  }

  /* ===== SECTION BASE ===== */
  .section{ padding:100px 0; }

  .section__small{
    font-size:.75rem;
    letter-spacing:.18em;
    font-weight:500;
    color:var(--sky-deep);
    margin-bottom:16px;
  }

  .section__title{
    font-family:var(--serif);
    font-weight:400;
    font-size:clamp(1.5rem, 3vw, 2.1rem);
    line-height:1.5;
    color:var(--ink);
    margin-bottom:12px;
  }

  .section__lead{
    color:var(--muted);
    font-size:.97rem;
    max-width:44ch;
    line-height:1.85;
  }

  .reveal{
    opacity:0; transform:translateY(24px);
    transition:opacity .75s ease, transform .75s cubic-bezier(.2,.7,.2,1);
  }
  .reveal.in{ opacity:1; transform:translateY(0); }
  .reveal.d1{ transition-delay:.1s; }
  .reveal.d2{ transition-delay:.2s; }
  .reveal.d3{ transition-delay:.3s; }

  /* ===== 강의 분야 ===== */
  .fields-wrap{
    margin-top:60px;
    display:flex;
    flex-direction:column;
    gap:0;
  }

  .field-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:0;
    border-top:1px solid #eee;
    padding:44px 0;
    align-items:center;
  }
  .field-row:last-child{ border-bottom:1px solid #eee; }

  .field-row:nth-child(even) .field__img{ order:-1; }

  .field__text{ padding:0 40px 0 0; }
  .field-row:nth-child(even) .field__text{ padding:0 0 0 40px; }

  .field__num{
    font-family:var(--serif);
    font-size:2.8rem;
    font-weight:300;
    color:var(--sky);
    line-height:1;
    margin-bottom:12px;
  }

  .field__name{
    font-size:1.22rem;
    font-weight:600;
    color:var(--ink);
    margin-bottom:10px;
  }

  .field__desc{
    font-size:.95rem;
    color:var(--muted);
    line-height:1.85;
    max-width:36ch;
  }

  .field__img{
    width:100%;
    aspect-ratio:4/3;
    border-radius:20px;
    overflow:hidden;
    background:var(--sky-soft);
    display:flex; align-items:center; justify-content:center;
    font-size:.82rem; color:var(--sky-deep);
    letter-spacing:.04em;
  }
  .field__img.peach-bg{ background:var(--peach-soft); color:var(--peach-deep); }
  .field__img.sky-bg{ background:var(--sky-soft); color:var(--sky-deep); }

  .field__img img{ width:100%; height:100%; object-fit:cover; }

  /* ===== 강의 배경 ===== */
  .bg-section{ background:var(--white); }

  .creds-wrap{
    margin-top:56px;
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:28px 48px;
  }

  .cred{
    display:flex;
    flex-direction:column;
    gap:6px;
    padding-bottom:28px;
    border-bottom:1px solid #f0f0f0;
  }

  .cred__main{
    font-size:1.02rem;
    font-weight:600;
    color:var(--ink);
  }

  .cred__sub{
    font-size:.88rem;
    color:var(--muted);
    line-height:1.7;
  }

  .cred__dot{
    width:8px; height:8px;
    border-radius:50%;
    background:var(--peach);
    margin-bottom:8px;
  }

  /* ===== 직접 만든 것들 ===== */
  .works-wrap{
    margin-top:56px;
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:32px;
  }

  .work{
    text-decoration:none;
    color:inherit;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .work__thumb{
    width:100%;
    aspect-ratio:16/9;
    border-radius:16px;
    overflow:hidden;
    background:var(--sky-soft);
    display:flex; align-items:center; justify-content:center;
    font-size:.82rem; color:var(--sky-deep);
    transition:transform .35s ease;
  }
  .work:hover .work__thumb{ transform:scale(1.02); }
  .work__thumb.peach{ background:var(--peach-soft); color:var(--peach-deep); }
  .work__thumb img{ width:100%; height:100%; object-fit:cover; }

  .work__badge{
    display:inline-block;
    font-size:.72rem;
    font-weight:600;
    letter-spacing:.05em;
    padding:4px 12px;
    border-radius:999px;
    background:var(--peach-soft);
    color:var(--peach-deep);
  }
  .work__badge.sky{
    background:var(--sky-soft);
    color:var(--sky-deep);
  }

  .work__name{
    font-size:1.05rem;
    font-weight:600;
    color:var(--ink);
  }

  .work__desc{
    font-size:.92rem;
    color:var(--muted);
    line-height:1.8;
  }

  /* ===== 강의 철학 ===== */
  .philosophy{
    padding:100px 0;
    background:var(--sky-soft);
  }

  .philosophy__inner{
    display:grid;
    grid-template-columns:1fr 1.4fr;
    gap:80px;
    align-items:start;
  }

  .philosophy__quote{
    font-family:var(--serif);
    font-size:clamp(1.4rem, 2.8vw, 2rem);
    font-weight:300;
    line-height:1.6;
    color:var(--ink);
    position:sticky;
    top:80px;
  }

  .philosophy__quote strong{
    font-weight:500;
    background:linear-gradient(transparent 65%, var(--peach) 65%);
  }

  .philosophy__body{
    display:flex;
    flex-direction:column;
    gap:22px;
  }

  .philosophy__body p{
    font-size:1rem;
    color:#4a4a4a;
    line-height:1.95;
  }

  /* ===== CTA ===== */
  .cta{
    padding:120px 0;
    text-align:center;
  }

  .cta__title{
    font-family:var(--serif);
    font-weight:400;
    font-size:clamp(1.8rem, 3.5vw, 2.6rem);
    color:var(--ink);
    margin-bottom:16px;
  }

  .cta__lead{
    font-size:1rem;
    color:var(--muted);
    margin-bottom:44px;
    line-height:1.85;
  }

  .btn{
    display:inline-flex;
    align-items:center;
    gap:10px;
    background:var(--peach);
    color:var(--ink);
    font-weight:600;
    font-size:.95rem;
    padding:16px 36px;
    border-radius:999px;
    text-decoration:none;
    transition:background .25s ease, transform .25s ease, box-shadow .25s ease;
    letter-spacing:.02em;
  }
  .btn:hover{
    background:var(--peach-deep);
    transform:translateY(-3px);
    box-shadow:0 14px 30px -10px rgba(240,160,122,.5);
  }

  .float-cta{
    position:fixed; right:22px; bottom:22px; z-index:50;
    background:var(--peach);
    color:var(--ink);
    font-weight:700;
    font-size:.88rem;
    padding:13px 22px;
    border-radius:999px;
    text-decoration:none;
    box-shadow:0 10px 26px -8px rgba(240,160,122,.6);
    opacity:0; transform:translateY(14px); pointer-events:none;
    transition:opacity .35s ease, transform .35s ease;
  }
  .float-cta.show{ opacity:1; transform:translateY(0); pointer-events:auto; }
  .float-cta:hover{ background:var(--peach-deep); }

  .footer{
    padding:36px 0;
    text-align:center;
    font-size:.82rem;
    color:var(--muted);
    border-top:1px solid #f0f0f0;
  }

  /* 음소거 토글 (커튼 음악용) */
  .mute-toggle{
    position:absolute;
    top:22px; right:22px;
    z-index:7;
    width:40px; height:40px;
    border-radius:50%;
    background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.3);
    color:#fff;
    font-size:.95rem;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    backdrop-filter:blur(6px);
    transition:background .2s ease;
  }
  .mute-toggle:hover{ background:rgba(255,255,255,.24); }

  @media(max-width:820px){
    .curtain-stage{ height:260vh; }
    .hero{ grid-template-columns:1fr; min-height:auto; padding:80px 0 60px; }
    .hero__img{ display:none; }
    .field-row{ grid-template-columns:1fr; gap:28px; }
    .field-row:nth-child(even) .field__img{ order:0; }
    .field__text, .field-row:nth-child(even) .field__text{ padding:0; }
    .creds-wrap{ grid-template-columns:1fr; gap:20px; }
    .works-wrap{ grid-template-columns:1fr; }
    .philosophy__inner{ grid-template-columns:1fr; gap:40px; }
    .philosophy__quote{ position:static; }
    .section{ padding:72px 0; }
    .philosophy{ padding:72px 0; }
    .cta{ padding:80px 0; }
  }

  @media(prefers-reduced-motion:reduce){
    *{ animation:none!important; transition:none!important; }
    .reveal{ opacity:1; transform:none; }
  }
</style>
</head>
<body>

<!-- ============================================
     커튼 히어로 (스크롤로 영상 진행)
     ============================================ -->
<div class="curtain-stage" id="curtainStage">
  <div class="curtain-sticky" id="curtainSticky">
    <div class="curtain-bg"></div>
    <video class="curtain-video" id="curtainVideo" muted loop playsinline poster="curtain.png">
      <source src="curtain.mp4" type="video/mp4">
    </video>
    <div class="curtain-light"></div>
    <div class="veil" id="curtainVeil"></div>
    <button class="mute-toggle" id="muteToggle" aria-label="배경음악 켜기/끄기">🔇</button>
    <div class="curtain-center" id="curtainCenter">
      <p class="curtain-label" id="curtainLabel"></p>
      <h1 class="curtain-hook" id="curtainHook"></h1>
      <p class="curtain-hint" id="curtainHint"></p>
    </div>
    <div class="scroll-cue" id="scrollCue">
      <span class="scroll-cue__label">SCROLL</span>
      <span class="scroll-cue__line"></span>
    </div>
  </div>
</div>

<audio id="bgm" loop preload="auto">
  <source src="Morning_Breeze.mp3" type="audio/mpeg">
</audio>

<!-- ===== HERO ===== -->
<header class="hero">
  <div class="wrap" style="display:contents;">
    <div class="hero__text wrap" style="max-width:none; padding-left:clamp(20px,6vw,120px);">
      <p class="hero__label reveal" id="heroLabel"></p>
      <h2 class="hero__hook reveal d1" id="heroHook"></h2>
      <p class="hero__sub reveal d2" id="heroSub"></p>
    </div>
    <div class="hero__img" style="display:none;">
      <div class="hero__img-frame">
        <img src="images/profile.jpg" alt="강사 은미" onerror="this.style.display='none'">
      </div>
    </div>
  </div>
</header>

<!-- 강의 분야 -->
<section class="section" id="fields">
  <div class="wrap">
    <p class="section__small reveal" id="fieldsSmall"></p>
    <h2 class="section__title reveal" id="fieldsTitle"></h2>
    <p class="section__lead reveal d1" id="fieldsLead"></p>
    <div class="fields-wrap" id="fieldsWrap"></div>
  </div>
</section>

<!-- 강의 배경 -->
<section class="section bg-section">
  <div class="wrap">
    <p class="section__small reveal" id="bgSmall"></p>
    <h2 class="section__title reveal" id="bgTitle"></h2>
    <p class="section__lead reveal d1" id="bgLead"></p>
    <div class="creds-wrap" id="credsWrap"></div>
  </div>
</section>

<!-- 직접 만든 것들 -->
<section class="section">
  <div class="wrap">
    <p class="section__small reveal" id="worksSmall"></p>
    <h2 class="section__title reveal" id="worksTitle"></h2>
    <p class="section__lead reveal d1" id="worksLead"></p>
    <div class="works-wrap" id="worksWrap"></div>
  </div>
</section>

<!-- 강의 철학 -->
<section class="philosophy">
  <div class="wrap">
    <div class="philosophy__inner">
      <div class="reveal">
        <p class="section__small" id="philSmall"></p>
        <p class="philosophy__quote" id="philQuote"></p>
      </div>
      <div class="philosophy__body reveal d1" id="philBody"></div>
    </div>
  </div>
</section>

<!-- CTA -->
<section class="cta" id="contact">
  <div class="wrap">
    <h2 class="cta__title reveal" id="ctaTitle"></h2>
    <p class="cta__lead reveal d1" id="ctaLead"></p>
    <a class="btn reveal d2" id="ctaBtn" href="#" target="_blank" rel="noopener"></a>
  </div>
</section>

<footer class="footer">
  <p id="footerText"></p>
</footer>

<a class="float-cta" href="#contact">문의하기</a>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="data.js"></script>
<script>
  /* ===========================================
     0. 콘텐츠 렌더링 — data.js의 PROFILE을 화면에 채움
     =========================================== */
  (function render(){
    const $ = id => document.getElementById(id);
    const P = PROFILE;

    document.title = P.meta.title.replace(' · ', ' — ') + ' 프로필';
    $('curtainLabel').textContent = P.meta.title;
    $('curtainHook').innerHTML = P.curtain.hook;
    $('curtainHint').textContent = P.curtain.hint;

    $('heroLabel').textContent = P.hero.label;
    $('heroHook').innerHTML = P.hero.hook;
    $('heroSub').innerHTML = P.hero.sub;

    $('fieldsSmall').textContent = P.fieldsSection.small;
    $('fieldsTitle').textContent = P.fieldsSection.title;
    $('fieldsLead').textContent = P.fieldsSection.lead;
    $('fieldsWrap').innerHTML = P.fields.map((f, i) => `
      <div class="field-row reveal">
        <div class="field__text">
          <div class="field__num">${String(i+1).padStart(2,'0')}</div>
          <h3 class="field__name">${f.name}</h3>
          <p class="field__desc">${f.desc}</p>
        </div>
        <div class="field__img ${f.imgClass}">
          ${f.img ? `<img src="${f.img}" alt="${f.name}" style="width:100%;height:100%;object-fit:cover;" onerror="this.remove()">` : '이미지 준비 중'}
        </div>
      </div>`).join('');

    $('bgSmall').textContent = P.bgSection.small;
    $('bgTitle').textContent = P.bgSection.title;
    $('bgLead').textContent = P.bgSection.lead;
    $('credsWrap').innerHTML = P.creds.map((c, i) => `
      <div class="cred reveal ${i % 2 ? 'd1' : ''}">
        <div class="cred__dot"></div>
        <span class="cred__main">${c.main}</span>
        <span class="cred__sub">${c.sub}</span>
      </div>`).join('');

    $('worksSmall').textContent = P.worksSection.small;
    $('worksTitle').textContent = P.worksSection.title;
    $('worksLead').textContent = P.worksSection.lead;
    $('worksWrap').innerHTML = P.works.map((w, i) => `
      <a class="work reveal ${i % 2 ? 'd1' : ''}" href="${w.link || '#'}" ${w.link ? 'target="_blank" rel="noopener"' : 'onclick="return false;" style="cursor:default;"'}>
        <div class="work__thumb ${w.thumbClass}">
          ${w.img ? `<img src="${w.img}" alt="${w.name}" onerror="this.style.display='none'">` : ''}
        </div>
        <span class="work__badge ${w.badgeClass}">${w.badge}</span>
        <h3 class="work__name">${w.name}</h3>
        <p class="work__desc">${w.desc}</p>
      </a>`).join('');

    $('philSmall').textContent = P.philosophy.small;
    $('philQuote').innerHTML = P.philosophy.quote;
    $('philBody').innerHTML = P.philosophy.body.map(t => `<p>${t}</p>`).join('');

    $('ctaTitle').textContent = P.cta.title;
    $('ctaLead').innerHTML = P.cta.lead;
    const btn = $('ctaBtn');
    btn.textContent = P.cta.btnLabel;
    btn.href = P.cta.btnLink;

    $('footerText').innerHTML = `${P.meta.title} &nbsp;·&nbsp; ${P.meta.region} &nbsp;·&nbsp; © ${P.meta.year}`;
  })();

  /* ===========================================
     1. 커튼 영상 ↔ 스크롤 동기화 (GSAP 로드 실패 시 건너뜀 —
        페이지 나머지는 정상 동작)
     =========================================== */
  if (window.gsap && window.ScrollTrigger) {
  gsap.registerPlugin(ScrollTrigger);

  const video = document.getElementById('curtainVideo');
  const curtainStage = document.getElementById('curtainStage');
  const curtainCenter = document.getElementById('curtainCenter');
  const scrollCue = document.getElementById('scrollCue');
  const curtainVeil = document.getElementById('curtainVeil');

  function setupVideoScroll(){
    const dur = video.duration && isFinite(video.duration) ? video.duration : 6;

    ScrollTrigger.create({
      trigger: curtainStage,
      start: 'top top',
      end: 'bottom top',
      scrub: true,
      onUpdate(self){
        try{ video.currentTime = self.progress * dur; }catch(e){}
      }
    });

    ScrollTrigger.create({
      trigger: curtainStage,
      start: 'top top',
      end: '20% top',
      scrub: true,
      onUpdate(self){
        const fade = 1 - self.progress;
        curtainCenter.style.opacity = fade;
        scrollCue.style.opacity = self.progress > 0.3 ? 0 : (1 - self.progress / 0.3);
      }
    });

    ScrollTrigger.create({
      trigger: curtainStage,
      start: '60% top',
      end: 'bottom top',
      scrub: true,
      onUpdate(self){
        curtainVeil.style.opacity = 1 - self.progress * 0.4;
      }
    });
  }

  if (video.readyState >= 1) {
    setupVideoScroll();
  } else {
    video.addEventListener('loadedmetadata', setupVideoScroll, { once:true });
  }
  } // end GSAP guard

  /* ===========================================
     2. 배경음악 — 개선된 로직
     문제였던 것:
     (a) scroll/wheel은 브라우저가 '사용자 동작'으로 인정하지 않아
         play()가 거부됨 → 실제로는 클릭/터치에서만 시작됐음
     (b) 탭 전환·화면 잠금·전화 수신 등으로 브라우저가 오디오를
         일시정지시켜도 기존 코드는 이를 감지하지 못해
         "재생 중" 상태로 착각 → 다시는 켜지지 않음 (자동으로 꺼진 듯 보임)
     해결:
     - 재생 여부를 플래그 대신 bgm.paused(실제 상태)로 판단
     - pause 이벤트를 감지해 버튼 아이콘 동기화
     - 탭으로 돌아오거나(visibilitychange) 다음 터치/클릭 시 자동 재개
     - 사용자가 직접 끈 경우(🔇)에는 재개하지 않음
     =========================================== */
  const bgm = document.getElementById('bgm');
  const muteToggle = document.getElementById('muteToggle');
  let userWantsMusic = true;   // 사용자가 🔇로 직접 끄면 false
  let fadeTimer = null;

  function syncIcon(){
    muteToggle.textContent = (bgm.paused || bgm.muted) ? '🔇' : '🔊';
  }

  function startMusic(){
    if (!userWantsMusic || !bgm.paused) return;
    if (fadeTimer) { clearInterval(fadeTimer); fadeTimer = null; }
    bgm.volume = 0;
    bgm.muted = false;
    bgm.play().then(() => {
      let vol = 0;
      fadeTimer = setInterval(() => {
        vol = Math.min(vol + 0.04, 0.45);
        bgm.volume = vol;
        if (vol >= 0.45) { clearInterval(fadeTimer); fadeTimer = null; }
      }, 80);
      syncIcon();
    }).catch(() => { /* 자동재생 차단 — 다음 사용자 동작에서 재시도 */ });
  }

  // 브라우저가 '사용자 동작'으로 인정하는 이벤트에서 시작/재개
  ['pointerdown', 'touchend', 'keydown', 'click'].forEach(evt => {
    window.addEventListener(evt, startMusic, { passive:true });
  });

  // 시스템에 의해 일시정지되면 아이콘을 실제 상태로 동기화
  bgm.addEventListener('pause', syncIcon);
  bgm.addEventListener('play', syncIcon);

  // 탭/앱으로 다시 돌아왔을 때 자동 재개
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && userWantsMusic && bgm.paused) startMusic();
  });

  muteToggle.addEventListener('click', (e) => {
    e.stopPropagation();
    if (bgm.paused || bgm.muted) {
      userWantsMusic = true;
      bgm.muted = false;
      startMusic();
    } else {
      userWantsMusic = false;
      bgm.pause();
    }
    syncIcon();
  });

  /* ===========================================
     3. 콘텐츠 섹션 reveal 애니메이션
     =========================================== */
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
  },{ threshold:0.12, rootMargin:'0px 0px -6% 0px' });
  document.querySelectorAll('.reveal').forEach(el=>io.observe(el));

  const floatCta = document.querySelector('.float-cta');
  const hero = document.querySelector('.hero');
  new IntersectionObserver((entries)=>{
    entries.forEach(e=>{ floatCta.classList.toggle('show', !e.isIntersecting); });
  },{ threshold:0.1 }).observe(hero);
</script>
</body>
</html>
